<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Agendamiento de Citas</title>
  <link rel="stylesheet" href="/static/agendamiento.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <section class="agenda-section">
    <div class="agenda-container">

      <div class="agenda-header">
        <h2>AGENDA TU <span>CITA</span></h2>
        <div class="title-underline"></div>
        <p>Reserva tu espacio en pocos pasos</p>
      </div>

      <form class="agenda-form">

        <div class="form-group">
          <label for="f-nombre-completo-1">Nombre Completo</label>
          <input id="f-nombre-completo-1" type="text" placeholder="Ingresa tu nombre" required>
        </div>

        <div class="form-group">
          <label for="f-correo-electronico-2">Correo Electrónico</label>
          <input id="f-correo-electronico-2" type="email" placeholder="ejemplo@email.com" required>
        </div>

        <div class="form-group">
          <label for="f-telefono-3">Teléfono</label>
          <input id="f-telefono-3" type="tel" placeholder="Tu número de contacto" required>
        </div>

        <div class="form-group">
          <label for="f-servicio-4">Servicio</label>
          <select id="f-servicio-4" required>
            <option value="">Selecciona un servicio</option>
            <option>Servicio Básico</option>
            <option>Servicio Premium</option>
            <option>Servicio VIP</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="f-fecha-5">Fecha</label>
            <input id="f-fecha-5" type="date" required>
          </div>

          <div class="form-group">
            <label for="f-hora-6">Hora</label>
            <input id="f-hora-6" type="time" required>
          </div>
        </div>

        <div class="form-group">
          <label for="f-mensaje-adicional-7">Mensaje adicional</label>
          <textarea id="f-mensaje-adicional-7" rows="4" placeholder="Detalles adicionales..."></textarea>
        </div>

        <button type="submit" class="btn primary large">
          Confirmar Cita
        </button>

      </form>

    </div>
  </section>

</body>
</html>
